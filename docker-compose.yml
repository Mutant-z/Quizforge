services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quiztrace
      POSTGRES_PASSWORD: quiztrace
      POSTGRES_DB: quiztrace
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      QT_SERVER_PORT: 8080
      QT_DATABASE_PATH: /data/app.db
      QT_UPLOAD_ROOT: /data
      QT_JWT_SECRET: ${QT_JWT_SECRET:-change-me}
      QT_API_KEY_MASTER_KEY: ${QT_API_KEY_MASTER_KEY:-}
    volumes:
      - appdata:/data
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["/app/server", "-worker"]
    environment:
      QT_DATABASE_PATH: /data/app.db
      QT_UPLOAD_ROOT: /data
      QT_JWT_SECRET: ${QT_JWT_SECRET:-change-me}
    volumes:
      - appdata:/data
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  qdrantdata:
  appdata:
